name: Bug
description: A match, a cancel, or a queue is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The orders, in the order they were sent, and the trades you got.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A short program is more useful than a paragraph.
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler
      placeholder: g++ 12, -std=c++17
    validations:
      required: true
